[project]
name = "zero-query"
version = "0.1.0"
description = "Ask questions about Impala data in natural language (Cloudera AI Workbench)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.5",
    "impyla>=0.24.0",
    "kerberos>=1.3.1",
    "langchain-core>=1.8.0",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.21",
    "mcp>=2.3.0",
    "pure-sasl>=0.6.2",
    "thrift-sasl>=0.4.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
zq-mcp = "zero_query.mcp_impala.server:main"
zq-backend = "zero_query.backend.app:main"
zq-frontend = "zero_query.frontend.server:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"
# The project root is also $HOME in CAI: only ever lint/format project code, never dotfolders
# (.cache/uv, .venv, .claude, .local, .vscode-server).
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py"]
extend-exclude = [".*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
